<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- 安全政策跟首頁一樣：程式只能從本站載入，資料只能連到微軟 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://graph.microsoft.com https://login.microsoftonline.com https://*.sharepoint.com; frame-src 'self' https://login.microsoftonline.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>和果日照 · Sam's Homepage</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="company.css">
  <script src="vendor/msal-browser-3.28.1.min.js"></script>
</head>
<body>
  <main class="wk" id="app">
    <nav class="wk-tabs" aria-label="工作"><a href="company.html">沁耘</a><a href="hecho.html" aria-current="page">土城和果</a></nav>
    <header class="wk-head">
      <div class="wk-head-l">
        <a class="cp-back" href="./">← 首頁</a>
        <h1 class="wk-title">和果 日照</h1>
        <p class="cp-take" id="take">—</p>
      </div>
      <div class="wk-head-r">
        <div class="wk-status" id="status"><span class="wk-dot"></span><span id="status-text">載入中</span></div>
      </div>
    </header>
    <div class="wk-banner" id="banner" hidden></div>

    <section class="cp-kpis three" id="kpis"></section>

    <section class="wk-card" aria-labelledby="h-rate">
      <div class="cp-head"><h2 id="h-rate">每月出席率（%）</h2></div>
      <div class="cp-chart" id="chart-rate"></div>
    </section>

    <section class="wk-card" aria-labelledby="h-flow">
      <div class="cp-head"><h2 id="h-flow">每月個案人數與進出</h2></div>
      <div class="cp-chart" id="chart-flow"></div>
      <div class="cp-legend"><span><i class="c1"></i>服務個案數</span><span><i class="c2"></i>新收</span><span><i class="c3"></i>未再服務</span></div>
    </section>

    <section class="wk-card" aria-labelledby="h-age">
      <div class="cp-head"><h2 id="h-age">年齡層（本月）</h2><span class="cp-note" id="age-note"></span></div>
      <div class="cp-chart" id="chart-age"></div>
    </section>

    <section class="wk-card" aria-labelledby="h-day">
      <div class="cp-head"><h2 id="h-day">每天實到與應到（最近 14 天）</h2></div>
      <div class="cp-chart" id="chart-day"></div>
      <div class="cp-legend"><span><i class="c1"></i>應到</span><span><i class="c2"></i>實到</span></div>
    </section>

    <p class="wk-foot" id="foot"></p>
    <p class="wk-foot"><a href="company.html">沁耘網站與社群 ›</a></p>
  </main>
  <script type="module" src="js/hecho.js"></script>
</body>
</html>
