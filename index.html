<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- 安全政策：程式只能從本站載入；資料只能連到微軟、天氣、地名與匯率這幾個網址 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://graph.microsoft.com https://login.microsoftonline.com https://*.sharepoint.com https://api.open-meteo.com https://api.bigdatacloud.net https://nominatim.openstreetmap.org https://cdn.jsdelivr.net https://*.currency-api.pages.dev; frame-src 'self' https://login.microsoftonline.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sam">
  <title>Sam's Homepage</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <!-- 官方 @azure/msal-browser 3.28.1，已比對 npm 套件內容一致（見 SETUP.md） -->
  <script src="vendor/msal-browser-3.28.1.min.js"></script>
  <!-- 官方 lunar-javascript 1.7.7（MIT，農民曆），已比對 npm 套件 sha512 一致（見 SETUP.md） -->
  <script src="vendor/lunar-javascript-1.7.7.js" defer></script>
</head>
<body>
  <main class="wk" id="app">
    <header class="wk-head">
      <div class="wk-head-l">
        <div class="wk-eyebrow">Sam's Homepage</div>
        <h1 class="wk-title" id="greeting">—</h1>
      </div>
      <div class="wk-head-r">
        <div class="wk-status" id="status"><span class="wk-dot"></span><span id="status-text">載入中</span></div>
        <div class="wk-actions">
          <button class="btn" id="btn-refresh" type="button" aria-label="重新整理">↻</button>
          <button class="btn" id="btn-account" type="button">登入</button>
        </div>
      </div>
    </header>

    <div class="wk-banner" id="banner" hidden></div>

    <section class="wx-pin" id="wxpin" aria-label="天氣與警報"></section>

    <section class="day" id="day" aria-label="今天">
      <div class="day-status" id="day-status"></div>
      <div class="day-tl" id="day-tl"></div>
      <button class="link-btn" id="btn-day-more" type="button" hidden></button>
    </section>

    <section class="wk-card cal" id="cal" aria-label="日曆"></section>

    <section class="wk-strip" id="strip" aria-label="即時資訊"></section>

    <div class="wk-sec">領域</div>
    <section class="wk-domains" id="domains"></section>

    <section class="wk-card focus" aria-labelledby="focus-h">
      <div class="focus-head">
        <h2 id="focus-h">今日重點</h2>
        <span class="count" id="focus-count"></span>
      </div>
      <ul class="focus-list" id="focus-list"></ul>
      <button class="link-btn" id="btn-focus-more" type="button" hidden></button>
      <button class="link-btn" id="btn-upcoming" type="button" hidden></button>
      <ul class="focus-list upcoming" id="upcoming-list" hidden></ul>
    </section>

    <div class="wk-sec" id="news-sec" hidden>新聞</div>
    <section class="wk-card news" id="news" aria-label="新聞" hidden>
      <div class="focus-head">
        <h2 id="news-h">早報、晚報整理的新聞</h2>
        <span class="count" id="news-count"></span>
      </div>
      <div class="n-digest" id="news-digest" hidden></div>
      <button class="link-btn" id="btn-news-list" type="button" hidden></button>
      <ul class="focus-list" id="news-list"></ul>
      <button class="link-btn" id="btn-news-more" type="button" hidden></button>
    </section>

    <p class="wk-foot" id="foot"></p>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
