<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- 安全政策跟首頁一樣：程式只能從本站載入，資料只能連到微軟 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://graph.microsoft.com https://login.microsoftonline.com https://*.sharepoint.com; frame-src 'self' https://login.microsoftonline.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>月曆 · Sam's Homepage</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="calendar.css">
  <script src="vendor/msal-browser-3.28.1.min.js"></script>
  <script src="vendor/lunar-javascript-1.7.7.js" defer></script>
</head>
<body>
  <main class="wk" id="app">
    <header class="wk-head">
      <div class="wk-head-l">
        <a class="cp-back" href="./">← 首頁</a>
        <h1 class="wk-title">月曆</h1>
      </div>
      <div class="wk-head-r">
        <div class="wk-status" id="status"><span class="wk-dot"></span><span id="status-text">載入中</span></div>
      </div>
    </header>
    <div class="wk-banner" id="banner" hidden></div>

    <section class="wk-card" aria-label="月曆">
      <div class="mc-nav">
        <button class="btn" id="prev" type="button" aria-label="上個月">‹</button>
        <div class="mc-title" id="mc-title">—</div>
        <button class="btn" id="next" type="button" aria-label="下個月">›</button>
        <button class="btn" id="today" type="button">今天</button>
      </div>
      <div class="cal-grid" id="grid"></div>
      <a class="mc-open" href="https://outlook.office.com/calendar/view/month" target="_blank" rel="noopener">打開 Outlook 行事曆 ›</a>
    </section>

    <section class="wk-card" id="detail" aria-label="選到的這一天"></section>
  </main>
  <script type="module" src="js/calendar.js"></script>
</body>
</html>
