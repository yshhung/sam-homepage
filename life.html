<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- 安全政策跟首頁一樣：程式只能從本站載入，資料只能連到微軟 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://graph.microsoft.com https://login.microsoftonline.com https://*.sharepoint.com; frame-src 'self' https://login.microsoftonline.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>生活 · Sam's Homepage</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="company.css">
  <link rel="stylesheet" href="life.css">
  <script src="vendor/msal-browser-3.28.1.min.js"></script>
  <script src="vendor/d3-7.9.0.min.js"></script>
</head>
<body>
  <main class="wk" id="app">
    <header class="wk-head">
      <div class="wk-head-l">
        <a class="cp-back" href="./">← 首頁</a>
        <h1 class="wk-title">生活</h1>
        <p class="cp-take" id="take">—</p>
      </div>
      <div class="wk-head-r">
        <div class="wk-status" id="status"><span class="wk-dot"></span><span id="status-text">載入中</span></div>
      </div>
    </header>
    <div class="wk-banner" id="banner" hidden></div>

    <section class="cp-kpis three" id="kpis"></section>

    <section class="wk-card" aria-labelledby="h-map">
      <div class="cp-head"><h2 id="h-map">足跡地圖</h2><span class="cp-note" id="map-note"></span></div>
      <div class="lf-map" id="map" role="img" aria-label="去過的國家與地點的世界地圖"></div>
    </section>

    <section class="wk-card" aria-labelledby="h-places">
      <div class="cp-head"><h2 id="h-places">去過的地方</h2></div>
      <div id="places"></div>
    </section>

    <section class="wk-card" aria-labelledby="h-trip">
      <div class="cp-head"><h2 id="h-trip">下一趟旅行</h2></div>
      <div id="trip"></div>
    </section>

    <section class="wk-card" aria-labelledby="h-todo">
      <div class="cp-head"><h2 id="h-todo">生活待辦</h2><span class="cp-note" id="todo-note"></span></div>
      <ul class="focus-list" id="todo"></ul>
    </section>

    <p class="wk-foot" id="foot"></p>
      </main>
  <script type="module" src="js/life.js"></script>
</body>
</html>
