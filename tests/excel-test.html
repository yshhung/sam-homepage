<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>ExcelStore test</title>
  <style>body { font: 14px system-ui; background: #000; color: #e6edf3; padding: 16px; } .ok { color: #2fd47a; } .bad { color: #f87171; }</style>
</head>
<body>
<h1>ExcelStore 測試（假的 Graph，只讀）</h1>
<ul id="out"></ul>
<script type="module">
import { ExcelStore } from '../js/store.js';
import { GraphError } from '../js/auth.js';

function fakeGraph({ exists = true } = {}) {
  const calls = [];
  const tables = {
    Cards: [['領域', '數字', '說明', '更新'], ['工作', '—', '', ''], ['沁耘', '3 篇', '課程規劃中', ''], ['', '', '', '']],
    Settings: [['項目', '值', '說明'], ['雨機率門檻', 70, ''], ['匯率變動門檻', '0.8', ''], ['不是數字', 'abc', '']],
  };
  async function graph(path, opts = {}) {
    const method = opts.method || 'GET';
    calls.push(`${method} ${path}`);
    if (method !== 'GET') throw new Error(`不該寫入：${method} ${path}`);
    if (path.startsWith('/me/drive/root:')) {
      if (!exists) throw new GraphError(404, 'itemNotFound');
      return { id: 'F1', webUrl: 'https://example/xlsx' };
    }
    const m = path.match(/\/tables\/(\w+)\/range\?/);
    if (m) return { values: tables[m[1]] };
    throw new Error(`fake graph: 沒處理 ${path}`);
  }
  return { graph, calls };
}

const out = document.getElementById('out');
let failed = 0;
function check(name, cond, detail = '') {
  if (!cond) failed++;
  const li = document.createElement('li');
  li.className = cond ? 'ok' : 'bad';
  li.textContent = `${cond ? '✓' : '✗'} ${name}${detail ? ` — ${detail}` : ''}`;
  out.append(li);
}

let g = fakeGraph();
let s = new ExcelStore(g.graph);
let db = await s.load();
check('讀到卡片，略過空白列', db.cards.length === 2 && db.cards[1].數字 === '3 篇', JSON.stringify(db.cards));
check('設定：Excel 的值蓋過預設，非數字略過', db.settings.雨機率門檻 === 70 && db.settings.匯率變動門檻 === 0.8 && db.settings.高溫門檻 === 34 && !('不是數字' in db.settings));
check('webUrl 有帶出來', s.webUrl === 'https://example/xlsx');
check('只有讀取，沒有任何寫入', g.calls.every((c) => c.startsWith('GET ')), g.calls.join(' | '));

g = fakeGraph({ exists: false });
s = new ExcelStore(g.graph);
db = await s.load();
check('沒有 Excel 檔：用預設門檻、不建立檔案', db.cards.length === 0 && db.settings.雨機率門檻 === 60 && g.calls.length === 1, g.calls.join(' | '));

document.title = failed ? `FAIL ${failed}` : 'PASS';
</script>
</body>
</html>
