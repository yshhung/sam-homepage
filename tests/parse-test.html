<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>Parser test</title>
  <style>body { font: 14px system-ui; background: #000; color: #e6edf3; padding: 16px; } .ok { color: #2fd47a; } .bad { color: #f87171; }</style>
</head>
<body>
<h1>和果、投資、生活資料解析測試</h1>
<ul id="out"></ul>
<script src="../vendor/lunar-javascript-1.7.7.js"></script>
<script type="module">
import { almanac, almanacText, lunarDay, toTrad } from '../js/almanac.js';
import { digestView, eventDays, hechoSummary, investView, lifeView, newsView, parseCsv } from '../js/sources.js';

const out = document.getElementById('out');
let failed = 0;
function check(name, cond, detail = '') {
  if (!cond) failed++;
  const li = document.createElement('li');
  li.className = cond ? 'ok' : 'bad';
  li.textContent = `${cond ? '✓' : '✗'} ${name}${detail ? ` — ${detail}` : ''}`;
  out.append(li);
}

// 「問 AI」的摘要：只能有日期和數字
const sum = hechoSummary({
  exported: '2026-11-04 16:40',
  month: { label: '2026/11', rate: 0.912, avg: 33.5, days: 3, upTo: '2026-11-04' },
  recent: [
    { date: '2026-11-04', expected: 38, present: null, clientLeave: 2, staffOn: 7, staffLeave: 1, incidents: 0 },
    { date: '2026-11-03', expected: 39, present: 35, clientLeave: 4, staffOn: 8, staffLeave: 2, incidents: 1 },
  ],
});
check('摘要有月出席率', sum.includes('91%') && sum.includes('33.5'), sum);
check('還沒點名寫清楚', sum.includes('還沒點名'));
check('摘要只有數字、日期與固定用語', !/[甲乙丙丁戊]|○/.test(sum));
check('沒有資料也不會壞', typeof hechoSummary(null) === 'string');

const csv = '﻿年,月,計算到,資料狀態,出席率,每日平均出席,服務日數\r\n2026,10,2026-10-31,完整,0.931,34.1,22\r\n2026,11,2026-11-03,進行中,"0.9",33.5,2\r\n';
const rows = parseCsv(csv);
check('CSV 列數', rows.length === 2, JSON.stringify(rows));
check('CSV 去掉 BOM、讀欄位', rows[0].年 === '2026' && rows[1].出席率 === '0.9' && rows[1].每日平均出席 === '33.5');

// 投資：只有彙總數字（假的數字）
const inv = { updated: '2026-01-05 07:30', asOf: { tw: '2026-01-02', us: '2026-01-02' }, totalTwd: 1234567, cathayTwd: 234567, schwabUsd: 33333.33, dayPct: -2.5, cathayDayPct: -1, schwabDayPct: -3, monthPct: 1.2, monthBase: '2025-12-31', stalePrices: 0 };
let v = investView(inv, '2026-01-05', 2);
check('投資卡大數字用萬', v.num === '123.5 萬', v.num);
check('投資說明有國泰、嘉信與變動', v.text.includes('國泰 23.5 萬') && v.text.includes('US$33,333') && v.text.includes('−2.50%') && v.text.includes('+1.20%'), v.text);
check('單日超過門檻列進重點，本月沒超過不列', v.alerts.length === 1 && v.alerts[0].type === 'day', JSON.stringify(v.alerts));
check('門檻可以調', investView(inv, '2026-01-05', 1).alerts.length === 2);
check('超過 3 天沒更新要提醒', investView(inv, '2026-01-08', 5).alerts.some((a) => a.type === 'stale'));
check('沒有資料不顯示', investView(null, '2026-01-05', 2) === null && investView({}, '2026-01-05', 2) === null);

// 生活：下一趟旅行優先用確定的，規劃中的提醒還沒訂
const tt = { tasks: [
  { id: 'a', title: '某銀行自動扣繳：明天扣款', list: '📦生活瑣事', due: '2026-01-07', time: '09:00' },
  { id: 'b', title: '家庭聚餐', list: '🏠我的家庭', due: '2026-01-06', time: null },
  { id: 'c', title: '公司的事', list: '💼公司營運', due: '2026-01-05', time: null },
] };
const life = { trips: [
  { name: '已經回來', start: '2025-12-20', end: '2025-12-22', status: 'confirmed' },
  { name: '規劃中旅行', start: '2026-01-15', end: '2026-01-17', status: 'planning', url: 'https://example.test/a' },
  { name: '確定的旅行', start: '2026-02-01', end: '2026-02-03', status: 'confirmed', url: 'https://example.test/b' },
] };
let lv = lifeView(life, tt, '2026-01-05');
check('倒數用下一趟確定的旅行', lv.num === '27 天' && lv.text.includes('確定的旅行') && lv.link === 'https://example.test/b', lv.text);
check('列出扣款與生活待辦，不算其他清單', lv.text.includes('扣款／帳單：某銀行自動扣繳（後天）') && lv.text.includes('生活待辦 2 件') && lv.text.includes('下一件：家庭聚餐（明天）'), lv.text);
check('規劃中的旅行 3 週內要提醒', lv.alerts.length === 1 && lv.alerts[0].title.includes('規劃中旅行'), JSON.stringify(lv.alerts));
lv = lifeView({ trips: [life.trips[1]] }, null, '2026-01-05');
check('只有規劃中的旅行也顯示倒數', lv.num === '10 天' && lv.text.includes('規劃中'), lv.text);
lv = lifeView({ trips: [{ name: '出門', start: '2026-01-04', end: '2026-01-06', status: 'confirmed' }] }, null, '2026-01-05');
check('旅行途中', lv.num === '旅行中', lv.num);
check('沒有資料不顯示', lifeView(null, null, '2026-01-05') === null);

// 新聞：7 天內、只留 http(s)、同網址留最新、新的在前（假的標題與網址）
const nnow = new Date('2026-01-08T12:00:00+08:00');
const nv = newsView([
  { title: '舊聞', url: 'https://example.test/old', at: '2025-12-31T08:50:00+08:00', by: '早報' },
  { title: '財經一', url: 'https://example.test/a?x=1', at: '2026-01-07T08:50:00+08:00', by: '早報', cat: '財經' },
  { title: '財經一（晚報又寫）', url: 'https://example.test/a', at: '2026-01-07T22:05:00+08:00', by: '晚報', cat: '財經' },
  { title: '生活一', url: 'https://example.test/l', at: '2026-01-08T08:50:00+08:00', by: '早報', cat: '生活' },
  { title: '壞網址', url: 'javascript:alert(1)', at: '2026-01-08T08:50:00+08:00' },
  { title: '', url: 'https://example.test/empty', at: '2026-01-08T08:50:00+08:00' },
], nnow);
check('新聞只留 7 天內、新的在前、同網址留最新', nv.map((n) => n.title).join('|') === '生活一|財經一（晚報又寫）', JSON.stringify(nv));
check('新聞帶日期與分類', nv[0].day === '2026-01-08' && nv[0].cat === '生活' && nv[1].by === '晚報');
check('新聞沒有資料不會壞', newsView(null, nnow).length === 0);

// 新聞摘要：取 3 天內最新一份、類別照順序、[文字](網址) 拆成連結、非 http 不當連結
const dv = digestView([
  { by: '晚報', at: '2026-01-07T22:05:00+08:00', items: [{ cat: '台股', text: '舊的' }] },
  { by: '早報', at: '2026-01-08T08:50:00+08:00', items: [
    { cat: '生活', text: '生活[一則](https://example.test/l)。' },
    { cat: '台股', text: '台股[甲](https://example.test/a)與[乙](javascript:x)。' },
    { cat: '其他', text: '不顯示' },
  ] },
], nnow);
check('摘要取最新一份', dv && dv.by === '早報' && dv.time === '08:50', JSON.stringify(dv));
check('摘要類別照順序', dv && dv.items.map((i) => i.cat).join('|') === '台股|生活');
check('摘要連結拆開、壞網址留文字', dv && JSON.stringify(dv.items[0].parts) === JSON.stringify([
  { text: '台股' }, { text: '甲', url: 'https://example.test/a' }, { text: '與乙。' }]), JSON.stringify(dv && dv.items[0].parts));
const dv2 = digestView([
  { by: '早報', at: '2026-01-08T08:50:00+08:00', items: [{ cat: '生活', text: '早上的生活' }, { cat: '台股', text: '早上的台股' }] },
  { by: '晚報', at: '2026-01-08T22:05:00+08:00', items: [{ cat: '台股', text: '晚上的台股' }] },
], new Date('2026-01-08T23:00:00+08:00'));
check('晚報沒有的類別用早報補、標出來源', dv2 && dv2.by === '晚報' && dv2.items.map((i) => `${i.cat}:${i.parts[0].text}:${i.from}`).join('|') === '台股:晚上的台股:|生活:早上的生活:早報', JSON.stringify(dv2));
check('摘要超過 3 天不顯示', digestView([{ by: '早報', at: '2026-01-01T08:50:00+08:00', items: [{ cat: '台股', text: 'x' }] }], nnow) === null);
check('摘要沒有資料不會壞', digestView(null, nnow) === null);

// 農民曆（套件離線計算；春節日期是公開的固定資料）
check('農曆：2026/2/17 是正月初一', almanac('2026-02-17')?.lunar === '正月初一', JSON.stringify(almanac('2026-02-17')));
check('農曆：2025/1/29 是正月初一', almanac('2025-01-29')?.lunar === '正月初一');
check('節氣：2026/2/4 立春', almanac('2026-02-04')?.term === '立春', almanac('2026-02-04')?.term);
check('宜忌轉繁體、各 3 項', (() => { const a = almanac('2026-11-05'); return a && a.yi.length <= 3 && a.ji.length <= 3 && !/[开动纳盖坏门会进]/.test(a.yi.join('') + a.ji.join('')); })(), almanacText('2026-11-05'));
check('簡轉繁', toTrad('开市、动土、纳财') === '開市、動土、納財');
check('月曆小字：初一顯示月份', lunarDay('2026-02-17') === '正月', lunarDay('2026-02-17'));
check('月曆小字：節氣優先', lunarDay('2026-02-04') === '立春', lunarDay('2026-02-04'));
check('月曆小字：一般日子', lunarDay('2026-11-05') === '廿七', lunarDay('2026-11-05'));

// 日曆打點：跨天行程每天都算，整天行程結束日（隔天 00:00）不算
const ed = eventDays([
  { start: '2026-11-05', end: '2026-11-05T10:00', allDay: false },
  { start: '2026-11-10', end: '2026-11-12T00:00', allDay: true },
  { start: '2026-11-20', end: '2026-11-21T09:00', allDay: false },
]);
check('日曆打點的日子', ed.join(',') === '2026-11-05,2026-11-10,2026-11-11,2026-11-20,2026-11-21', ed.join(','));

document.title = failed ? `FAIL ${failed}` : 'PASS';
</script>
</body>
</html>
