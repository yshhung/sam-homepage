<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>Parser test</title>
  <style>body { font: 14px system-ui; background: #000; color: #e6edf3; padding: 16px; } .ok { color: #2fd47a; } .bad { color: #f87171; }</style>
</head>
<body>
<h1>和果、投資、生活資料解析測試</h1>
<ul id="out"></ul>
<script src="../vendor/lunar-javascript-1.7.7.js"></script>
<script type="module">
import { almanac, almanacText, lunarDay, toTrad } from '../js/almanac.js';
import { dailySeries, latestWithChange, sumLast, webSeries } from '../js/company-data.js';
import { alertsView, dayView, digestView, eventDays, hechoSummary, investView, lifeView, newsView, parseCsv } from '../js/sources.js';

const out = document.getElementById('out');
let failed = 0;
function check(name, cond, detail = '') {
  if (!cond) failed++;
  const li = document.createElement('li');
  li.className = cond ? 'ok' : 'bad';
  li.textContent = `${cond ? '✓' : '✗'} ${name}${detail ? ` — ${detail}` : ''}`;
  out.append(li);
}

// 「問 AI」的摘要：只能有日期和數字
const sum = hechoSummary({
  exported: '2026-11-04 16:40',
  month: { label: '2026/11', rate: 0.912, avg: 33.5, days: 3, upTo: '2026-11-04' },
  recent: [
    { date: '2026-11-04', expected: 38, present: null, clientLeave: 2, staffOn: 7, staffLeave: 1, incidents: 0 },
    { date: '2026-11-03', expected: 39, present: 35, clientLeave: 4, staffOn: 8, staffLeave: 2, incidents: 1 },
  ],
});
check('摘要有月出席率', sum.includes('91%') && sum.includes('33.5'), sum);
check('還沒點名寫清楚', sum.includes('還沒點名'));
check('摘要只有數字、日期與固定用語', !/[甲乙丙丁戊]|○/.test(sum));
check('沒有資料也不會壞', typeof hechoSummary(null) === 'string');

const csv = '﻿年,月,計算到,資料狀態,出席率,每日平均出席,服務日數\r\n2026,10,2026-10-31,完整,0.931,34.1,22\r\n2026,11,2026-11-03,進行中,"0.9",33.5,2\r\n';
const rows = parseCsv(csv);
check('CSV 列數', rows.length === 2, JSON.stringify(rows));
check('CSV 去掉 BOM、讀欄位', rows[0].年 === '2026' && rows[1].出席率 === '0.9' && rows[1].每日平均出席 === '33.5');

// 投資：只有彙總數字（假的數字）
const inv = { updated: '2026-01-05 07:30', asOf: { tw: '2026-01-02', us: '2026-01-02' }, totalTwd: 1234567, cathayTwd: 234567, schwabUsd: 33333.33, dayPct: -2.5, cathayDayPct: -1, schwabDayPct: -3, monthPct: 1.2, monthBase: '2025-12-31', stalePrices: 0 };
let v = investView(inv, '2026-01-05', 2);
check('投資卡大數字用萬', v.num === '123.5 萬', v.num);
check('投資說明有國泰、嘉信與變動', v.text.includes('國泰 23.5 萬') && v.text.includes('US$33,333') && v.text.includes('−2.50%') && v.text.includes('+1.20%'), v.text);
check('單日超過門檻列進重點，本月沒超過不列', v.alerts.length === 1 && v.alerts[0].type === 'day', JSON.stringify(v.alerts));
check('門檻可以調', investView(inv, '2026-01-05', 1).alerts.length === 2);
check('超過 3 天沒更新要提醒', investView(inv, '2026-01-08', 5).alerts.some((a) => a.type === 'stale'));
check('沒有資料不顯示', investView(null, '2026-01-05', 2) === null && investView({}, '2026-01-05', 2) === null);

// 生活：下一趟旅行優先用確定的，規劃中的提醒還沒訂
const tt = { tasks: [
  { id: 'a', title: '某銀行自動扣繳：明天扣款', list: '📦生活瑣事', due: '2026-01-07', time: '09:00' },
  { id: 'b', title: '家庭聚餐', list: '🏠我的家庭', due: '2026-01-06', time: null },
  { id: 'c', title: '公司的事', list: '💼公司營運', due: '2026-01-05', time: null },
] };
const life = { trips: [
  { name: '已經回來', start: '2025-12-20', end: '2025-12-22', status: 'confirmed' },
  { name: '規劃中旅行', start: '2026-01-15', end: '2026-01-17', status: 'planning', url: 'https://example.test/a' },
  { name: '確定的旅行', start: '2026-02-01', end: '2026-02-03', status: 'confirmed', url: 'https://example.test/b' },
] };
let lv = lifeView(life, tt, '2026-01-05');
check('倒數用下一趟確定的旅行', lv.num === '27 天' && lv.text.includes('確定的旅行') && lv.link === 'https://example.test/b', lv.text);
check('列出扣款與生活待辦，不算其他清單', lv.text.includes('扣款／帳單：某銀行自動扣繳（後天）') && lv.text.includes('生活待辦 2 件') && lv.text.includes('下一件：家庭聚餐（明天）'), lv.text);
check('規劃中的旅行 3 週內要提醒', lv.alerts.length === 1 && lv.alerts[0].title.includes('規劃中旅行'), JSON.stringify(lv.alerts));
lv = lifeView({ trips: [life.trips[1]] }, null, '2026-01-05');
check('只有規劃中的旅行也顯示倒數', lv.num === '10 天' && lv.text.includes('規劃中'), lv.text);
lv = lifeView({ trips: [{ name: '出門', start: '2026-01-04', end: '2026-01-06', status: 'confirmed' }] }, null, '2026-01-05');
check('旅行途中', lv.num === '旅行中', lv.num);
check('沒有資料不顯示', lifeView(null, null, '2026-01-05') === null);

// 新聞：7 天內、只留 http(s)、同網址留最新、新的在前（假的標題與網址）
const nnow = new Date('2026-01-08T12:00:00+08:00');
const nv = newsView([
  { title: '舊聞', url: 'https://example.test/old', at: '2025-12-31T08:50:00+08:00', by: '早報' },
  { title: '財經一', url: 'https://example.test/a?x=1', at: '2026-01-07T08:50:00+08:00', by: '早報', cat: '財經' },
  { title: '財經一（晚報又寫）', url: 'https://example.test/a', at: '2026-01-07T22:05:00+08:00', by: '晚報', cat: '財經' },
  { title: '生活一', url: 'https://example.test/l', at: '2026-01-08T08:50:00+08:00', by: '早報', cat: '生活' },
  { title: '壞網址', url: 'javascript:alert(1)', at: '2026-01-08T08:50:00+08:00' },
  { title: '', url: 'https://example.test/empty', at: '2026-01-08T08:50:00+08:00' },
], nnow);
check('新聞只留 7 天內、新的在前、同網址留最新', nv.map((n) => n.title).join('|') === '生活一|財經一（晚報又寫）', JSON.stringify(nv));
check('新聞帶日期與分類', nv[0].day === '2026-01-08' && nv[0].cat === '生活' && nv[1].by === '晚報');
check('新聞沒有資料不會壞', newsView(null, nnow).length === 0);

// 新聞摘要：取 3 天內最新一份、類別與順序照檔案（不寫死）、[文字](網址) 拆成連結、非 http 不當連結
const dv = digestView([
  { by: '晚報', at: '2026-01-07T22:05:00+08:00', items: [{ cat: '台股', text: '舊的' }] },
  { by: '早報', at: '2026-01-08T08:50:00+08:00', items: [
    { cat: '生活', text: '生活[一則](https://example.test/l)。' },
    { cat: '台股', text: '台股[甲](https://example.test/a)與[乙](javascript:x)。' },
    { cat: '長照', text: '長照第一句。', more: '長照更多[丙](https://example.test/c)。', tag: '日照' },
  ] },
], nnow);
check('摘要取最新一份', dv && dv.by === '早報' && dv.time === '08:50', JSON.stringify(dv));
check('摘要類別照檔案順序、不認識的名稱也顯示', dv && dv.items.map((i) => i.cat).join('|') === '生活|台股|長照');
check('摘要連結拆開、壞網址留文字', dv && JSON.stringify(dv.items[1].parts) === JSON.stringify([
  { text: '台股' }, { text: '甲', url: 'https://example.test/a' }, { text: '與乙。' }]), JSON.stringify(dv && dv.items[1].parts));
check('摘要：more 與 tag 帶出來、沒寫的是 null／空', dv && dv.items[2].tag === '日照' && dv.items[2].more.length === 3 && dv.items[2].more[1].url === 'https://example.test/c'
  && dv.items[0].more === null && dv.items[0].tag === '');
check('摘要顏色：台股用藍、其他用綠', dv && dv.items[1].tone === 'fin' && dv.items[0].tone === 'life' && dv.items[2].tone === 'life');
const dv2 = digestView([
  { by: '早報', at: '2026-01-08T08:50:00+08:00', items: [{ cat: '長照', text: '早上的長照' }, { cat: '生活', text: '早上的生活' }, { cat: '台股', text: '早上的台股' }, { cat: '美股', text: '早上的美股' }] },
  { by: '晚報', at: '2026-01-08T22:05:00+08:00', items: [{ cat: '台股', text: '晚上的台股' }, { cat: '總經', text: '晚上的總經' }] },
], new Date('2026-01-08T23:00:00+08:00'));
check('晚報沒有的類別用早報補、標出來源，位置照早報的前後順序', dv2 && dv2.by === '晚報'
  && dv2.items.map((i) => `${i.cat}:${i.parts[0].text}:${i.from}`).join('|') === '長照:早上的長照:早報|生活:早上的生活:早報|台股:晚上的台股:|美股:早上的美股:早報|總經:晚上的總經:', JSON.stringify(dv2 && dv2.items.map((i) => i.cat)));
const dv3 = digestView([{ by: '早報', at: '2026-01-08T08:50:00+08:00', items: Array.from({ length: 12 }, (_, i) => ({ cat: `類${i}`, text: 'x' })) }], nnow);
check('摘要最多 8 類', dv3 && dv3.items.length === 8);
check('摘要空白的 text、沒類別的略過', digestView([{ by: '早報', at: '2026-01-08T08:50:00+08:00', items: [{ cat: '台股', text: '  ' }, { cat: '', text: 'x' }] }], nnow) === null);
check('摘要超過 3 天不顯示', digestView([{ by: '早報', at: '2026-01-01T08:50:00+08:00', items: [{ cat: '台股', text: 'x' }] }], nnow) === null);
check('摘要沒有資料不會壞', digestView(null, nnow) === null);

// 天氣與營運警報：只顯示 risk、warn；過期的、沒標題的、ok 的不顯示；檔太久沒更新要提醒；兩個檔合併、同標題去重
const anow = new Date('2026-11-08T12:00:00+08:00');
const av = alertsView([
  { path: 'Sam Homepage/alerts_weather.json', updated: '2026-11-08 07:35', by: '每日同步', alerts: [
    { tag: '海上颱風警報', lvl: 'risk', title: '示範颱風海上警報生效', text: '北部風雨最大在晚上', until: '2026-11-09', src: '中央氣象署', url: 'https://example.test/t' },
    { tag: '低溫警戒', lvl: 'warn', title: '低溫特報生效', until: '2026-11-07' },
    { tag: '停班停課', lvl: 'ok', title: '今天正常上班上課' },
    { tag: '強風特報', lvl: 'warn', title: '強風特報生效', url: 'javascript:alert(1)' },
    { lvl: 'risk' },
  ] },
  { path: 'Sam Homepage/alerts_ops.json', updated: '2026-11-07 05:00', by: '早報', alerts: [
    { tag: '停水停電', lvl: 'warn', title: '土城明日停水', text: '09:00–17:00 提前儲水' },
    { tag: '強風特報', lvl: 'warn', title: '強風特報生效' },
  ] },
], '2026-11-08', anow);
check('警報：只留 risk、warn，過期的與 ok 的不顯示', av.entries.map((e) => e.title).join('|') === '示範颱風海上警報生效|強風特報生效|土城明日停水', JSON.stringify(av.entries.map((e) => e.title)));
check('警報：壞網址拿掉、好網址留著、同標題去重', av.entries[0].url === 'https://example.test/t' && av.entries[1].url === '' && av.entries.length === 3);
check('警報：超過 30 小時沒更新的檔要提醒', av.stale.length === 1 && av.stale[0].name.includes('ops') && av.stale[0].hours >= 30, JSON.stringify(av.stale));
check('警報：空的、沒檔都不會壞', alertsView([], '2026-11-08', anow).entries.length === 0 && alertsView(null, '2026-11-08', anow).entries.length === 0 && alertsView([{ alerts: [] }], '2026-11-08', anow).entries.length === 0);

// 沁耘頁的資料整理
const ch = { web: [{ month: '2026-11', views: 15, visitors: 8, posts: 2 }, { month: '2026-10', views: 436, visitors: 129, posts_published: 2 }, { month: 'bad', views: 1 }],
  social: [
    { date: '2026-11-01', network: 'instagram', followers: 66, views: 3 }, { date: '2026-10-01', network: 'instagram', followers: 60, views: 1 },
    { date: '2026-11-03', network: 'instagram', followers: 68, views: null }, { date: '2026-11-03', network: 'facebook', followers: 103 },
    { date: '2026-11-02', network: 'instagram', followers: 67 }, { date: 'x', network: 'instagram', followers: 1 } ] };
check('網站月數字：照月份排、壞的不要、posts_published 也認', JSON.stringify(webSeries(ch).map((r) => [r.month, r.posts])) === '[["2026-10",2],["2026-11",2]]');
check('每日數字：照日期排、壞日期不要', JSON.stringify(dailySeries(ch, 'instagram', 'followers').map((p) => p.date)) === '["2026-10-01","2026-11-01","2026-11-02","2026-11-03"]');
check('每日數字：沒有的欄位是 null、只取近 N 天筆數', dailySeries(ch, 'instagram', 'views')[3].value === null && dailySeries(ch, 'instagram', 'followers', 2).length === 2);
const lc = latestWithChange(dailySeries(ch, 'instagram', 'followers'), 30);
check('最新值與 30 天前相比', lc.value === 68 && lc.change === 8 && lc.since === '2026-10-01', JSON.stringify(lc));
check('只有一筆時沒有變化', latestWithChange(dailySeries(ch, 'facebook', 'followers')).change === null);
check('區間合計、沒資料回 null', sumLast(dailySeries(ch, 'instagram', 'views'), 7) === 4 && sumLast([], 7) === null && webSeries(null).length === 0 && dailySeries(undefined, 'facebook', 'views').length === 0);

// 今日時間軸：定時項目排在前面、過去的標 past、現在線的位置、全天與逾期排後面、狀態一句話
const dvw = dayView({
  events: [{ subject: '站會', start: '2026-11-08T10:00', end: '2026-11-08T11:00', allDay: false, location: '和果' }, { subject: '訪視', start: '2026-11-08T15:00', end: '2026-11-08T16:30', allDay: false }, { subject: '明天的', start: '2026-11-09T09:00', end: '2026-11-09T10:00', allDay: false }],
  tasks: [{ title: '核銷', list: '🏫社區長照營運', due: '2026-11-08', time: '09:00', priority: 5 }, { title: '全天待辦', list: '📦生活瑣事', due: '2026-11-08' }, { title: '舊事', list: '💼公司營運', due: '2026-11-06' }, { title: '之後', due: '2026-11-12', time: '10:00' }],
  alerts: [{ title: '強風特報', lvl: 'warn', text: '到 23:00' }],
}, '2026-11-08', '12:30');
check('時間軸：定時的排前面、再來警報與全天、最後逾期', dvw.items.map((i) => i.title).join('|') === '核銷|站會|訪視|強風特報|全天待辦|舊事', dvw.items.map((i) => i.title).join('|'));
check('時間軸：過去的標 past、現在線在第一個還沒到的前面', dvw.items[0].past === true && dvw.items[1].past === true && dvw.items[2].past === false && dvw.nowAt === 2);
check('時間軸：狀態是「要留意」、件數與下一件', dvw.tone === 'warn' && dvw.head === '今天有 2 件要留意' && dvw.counts.upcoming === 1 && dvw.detail.includes('下一件 15:00 訪視'), JSON.stringify(dvw.head + '|' + dvw.detail));
check('時間軸：明天的、之後的不放進今天', !dvw.items.some((i) => i.title === '明天的' || i.title === '之後'));
check('時間軸：逾期天數與清單名稱（拿掉 emoji）', dvw.items.at(-1).meta === '已逾 2 天 · 公司營運' && dvw.items[0].meta === '社區長照營運' && dvw.items[0].tone === 'warn');
const dv0 = dayView({ events: [], tasks: [], alerts: [] }, '2026-11-08', '12:30');
check('時間軸：什麼都沒有時是綠色「沒有要緊的事」', dv0.tone === 'ok' && dv0.head === '今天沒有要緊的事' && dv0.items.length === 0 && dv0.nowAt === -1);
check('時間軸：有紅色警報就是紅色狀態', dayView({ alerts: [{ title: '海上颱風警報生效', lvl: 'risk' }] }, '2026-11-08', '12:30').tone === 'bad');
check('時間軸：全部都過了，現在線在最後一個定時項目後面', dayView({ events: [{ subject: 'x', start: '2026-11-08T08:00', end: '2026-11-08T09:00' }] }, '2026-11-08', '12:30').nowAt === 1);

// 家屬提醒：訊息草稿會帶出來、太長會截斷；時間軸不重複放它，但狀態仍算件數
const fam = alertsView([{ path: 'x', updated: '2026-11-08 21:35', alerts: [{ tag: '家屬提醒', lvl: 'warn', title: '明天偏冷', text: '建議今晚請護理師提醒家屬', until: '2026-11-09', family: '各位家屬好，明天天氣偏冷。' + 'x'.repeat(500) }, { tag: '低溫警戒', lvl: 'warn', title: '低溫特報生效' }] }], '2026-11-08', new Date('2026-11-08T22:00:00+08:00'));
check('家屬提醒：family 帶出來並截成 400 字', fam.entries[0].family.startsWith('各位家屬好') && fam.entries[0].family.length === 400 && fam.entries[1].family === '');
const dvf = dayView({ alerts: fam.entries }, '2026-11-08', '12:00');
check('家屬提醒：不進時間軸、但算在要留意的件數', !dvf.items.some((i) => i.title === '明天偏冷') && dvf.items.some((i) => i.title === '低溫特報生效') && dvf.counts.yellow === 2 && dvf.head === '今天有 2 件要留意');

// 農民曆（套件離線計算；春節日期是公開的固定資料）
check('農曆：2026/2/17 是正月初一', almanac('2026-02-17')?.lunar === '正月初一', JSON.stringify(almanac('2026-02-17')));
check('農曆：2025/1/29 是正月初一', almanac('2025-01-29')?.lunar === '正月初一');
check('節氣：2026/2/4 立春', almanac('2026-02-04')?.term === '立春', almanac('2026-02-04')?.term);
check('宜忌轉繁體、各 3 項', (() => { const a = almanac('2026-11-05'); return a && a.yi.length <= 3 && a.ji.length <= 3 && !/[开动纳盖坏门会进]/.test(a.yi.join('') + a.ji.join('')); })(), almanacText('2026-11-05'));
check('簡轉繁', toTrad('开市、动土、纳财') === '開市、動土、納財');
check('月曆小字：初一顯示月份', lunarDay('2026-02-17') === '正月', lunarDay('2026-02-17'));
check('月曆小字：節氣優先', lunarDay('2026-02-04') === '立春', lunarDay('2026-02-04'));
check('月曆小字：一般日子', lunarDay('2026-11-05') === '廿七', lunarDay('2026-11-05'));

// 日曆打點：跨天行程每天都算，整天行程結束日（隔天 00:00）不算
const ed = eventDays([
  { start: '2026-11-05', end: '2026-11-05T10:00', allDay: false },
  { start: '2026-11-10', end: '2026-11-12T00:00', allDay: true },
  { start: '2026-11-20', end: '2026-11-21T09:00', allDay: false },
]);
check('日曆打點的日子', ed.join(',') === '2026-11-05,2026-11-10,2026-11-11,2026-11-20,2026-11-21', ed.join(','));

document.title = failed ? `FAIL ${failed}` : 'PASS';
</script>
</body>
</html>
